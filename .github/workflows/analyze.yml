name: Analyze Book Photo
run-name: 分析 ${{ github.event.inputs.image_id }}

on:
  workflow_dispatch:
    inputs:
      image_base64:
        description: 'JPEG 圖片 base64（唔含 data: 前綴）'
        required: true
        type: string
      image_id:
        description: '用戶端生成嘅唯一 ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clean stale pending results (超過 7 日)
        run: |
          mkdir -p data/pending
          find data/pending -name '*.json' -mtime +7 -delete || true

      - name: Run AI analysis (OpenRouter vision model)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/analyze.py "${{ github.event.inputs.image_id }}" <<'CB_EOF'
          ${{ github.event.inputs.image_base64 }}
          CB_EOF

      - name: Commit analysis result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending
          if git diff --cached --quiet; then
            echo "No new pending file."
            exit 0
          fi
          git commit -m "AI analysis result: ${{ github.event.inputs.image_id }}"
          for i in 1 2 3; do
            git pull --rebase origin main && break || sleep 3
          done
          git push
